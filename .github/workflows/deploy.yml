name: deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: write ssh key
        shell: bash
        run: |
          set -euo pipefail
          # важно: ssh-agent иногда предлагает не тот ключ или ключ некорректно подхватывается;
          # поэтому кладем ключ в файл и указываем его явно.
          printf '%s\n' "$DEPLOY_SSH_KEY" > deploy_key
          chmod 600 deploy_key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: add known_hosts
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${DEPLOY_PORT}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}

      - name: deploy via ssh
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ./deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o PasswordAuthentication=no \
            -p "${DEPLOY_PORT}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -lc ' \
            set -euo pipefail; \
            if [ -z \"${DEPLOY_PATH}\" ]; then echo \"DEPLOY_PATH is empty\"; exit 2; fi; \
            cd \"${DEPLOY_PATH}\"; \
            # если на сервере есть ssh-ключ для github (например /root/.ssh/github),
            # заставляем git использовать именно его (чтобы не падать на default keys)
            if [ -f \"$HOME/.ssh/github\" ]; then \
              export GIT_SSH_COMMAND=\"ssh -o IdentitiesOnly=yes -i $HOME/.ssh/github\"; \
            fi; \
            # первое выполнение: делаем git init + remote + fetch/reset,
            # чтобы не зависеть от того, пустая ли директория
            if [ ! -d .git ]; then \
              git init; \
            fi; \
            if git remote get-url origin >/dev/null 2>&1; then \
              git remote set-url origin git@github.com:Sam-Polo/drmamashov-bot.git; \
            else \
              git remote add origin git@github.com:Sam-Polo/drmamashov-bot.git; \
            fi; \
            git fetch origin main --prune; \
            git reset --hard origin/main; \
            docker compose build --pull; \
            docker compose up -d; \
            docker compose ps \
          '"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

